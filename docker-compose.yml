version: '3.8'

services:
  # Order Service (Quarkus)
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: order-service-app
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      postgresql:
        condition: service_healthy
      artemis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - order-network
    restart: unless-stopped

  # PostgreSQL Database for order-service
  postgresql:
    image: postgres:15-alpine
    container_name: order-service-db
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  # ActiveMQ Artemis Message Broker
  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: order-service-artemis
    ports:
      - "61616:61616"    # JMS protocol port
      - "8161:8161"      # Web console (admin/admin)
    env_file: .env
    volumes:
      - artemis-data:/var/lib/artemis-instance
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8161/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: order-service-pgadmin
    ports:
      - "5050:80"
    env_file: .env
    depends_on:
      - postgresql
    networks:
      - order-network

  # Web API Gateway (Node.js)
  api-gateway-web:
    build:
      context: ./services/api-gateway-web
      dockerfile: Dockerfile
    container_name: api-gateway-web-app
    ports:
      - "4000:4000"
    env_file: .env

    depends_on:
      - user-service
      - book-service
      - order-service
    networks:
      - order-network

  # Mobile API Gateway (Python)
  api-gateway-mobile:
    build:
      context: ./services/api-gateway-mobile
      dockerfile: Dockerfile
    container_name: api-gateway-mobile-app
    ports:
      - "5005:5000"
    environment:
      USER_SERVICE_URL: user-service:9090
      BOOK_SERVICE_URL: http://book-service:5000
      ORDER_SERVICE_URL: http://order-service:8080
    depends_on:
      - user-service
      - book-service
      - order-service
    networks:
      - order-network

  # PostgreSQL for User Service
  user-postgres:
    image: postgres:15-alpine
    container_name: user-service-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: orders_dev
      POSTGRES_PASSWORD: orders_dev
      POSTGRES_DB: users_db
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  # User Service (Java gRPC)
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service-app
    environment:
      - DB_URL=jdbc:postgresql://user-postgres:5432/users_db
      - DB_USERNAME=orders_dev
      - DB_PASSWORD=orders_dev
    ports:
      - "9090:9090"
    depends_on:
      user-postgres:
        condition: service_healthy
    networks:
      - order-network

  # Book Service (C# REST)
  book-service:
    build:
      context: ./services/book-service
      dockerfile: Dockerfile
    container_name: book-service-app
    ports:
      - "8000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=book-postgres;Port=5432;Database=books_db;Username=postgres;Password=postgres
    depends_on:
      - book-postgres
    networks:
      - order-network

  # PostgreSQL for Book Service
  book-postgres:
    image: postgres:15-alpine
    container_name: book-service-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: books_db
    volumes:
      - book-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

volumes:
  postgres-data:
    driver: local
  artemis-data:
    driver: local
  book-postgres-data:
    driver: local
  user-postgres-data:
    driver: local

networks:
  order-network:
    driver: bridge
