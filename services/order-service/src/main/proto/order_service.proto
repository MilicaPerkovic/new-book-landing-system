syntax = "proto3";

package si.um.feri.orders.grpc;

option java_multiple_files = true;
option java_package = "si.um.feri.orders.grpc.service";
option java_outer_classname = "OrderServiceProto";

/**
 * Order Service gRPC API
 * 
 * Provides inter-service operations for order management.
 * Used by: user-service, notification-service, analytics-service
 * 
 * Protocol: HTTP/2 with binary Protocol Buffers
 * Port: 9091
 */
service OrderService {
    // Create a new order
    rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
    
    // Retrieve an order by ID
    rpc GetOrder(GetOrderRequest) returns (OrderResponse);
    
    // Confirm an order (transition PENDING → CONFIRMED)
    rpc ConfirmOrder(ConfirmOrderRequest) returns (OrderResponse);
    
    // Cancel an order (transition to CANCELLED)
    rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
    
    // Fulfill an order (transition CONFIRMED → FULFILLED)
    rpc FulfillOrder(FulfillOrderRequest) returns (OrderResponse);
    
    // Find all orders by user ID (for dashboard/notifications)
    rpc ListOrdersByUser(ListOrdersRequest) returns (OrderList);
}

// ============================================================================
// REQUEST MESSAGES
// ============================================================================

/**
 * Create new order request.
 * 
 * Validation (performed by server):
 * - book_id and user_id must be valid UUIDs
 * - quantity must be > 0
 * - price must be > 0 (as string: "29.99")
 */
message CreateOrderRequest {
    string book_id = 1;     // UUID of book being ordered (required)
    string user_id = 2;     // UUID of user creating order (required)
    int32 quantity = 3;     // Number of copies (must be positive)
    string price = 4;       // Unit price as decimal string (required, e.g., "29.99")
}

/**
 * Get order by ID request.
 * 
 * Returns OrderResponse if order exists.
 * Returns gRPC error 5 (NOT_FOUND) if order doesn't exist.
 */
message GetOrderRequest {
    string order_id = 1;    // UUID of order to retrieve (required)
}

/**
 * Confirm order request.
 * 
 * Transitions order from PENDING → CONFIRMED.
 * Only PENDING orders can be confirmed.
 * 
 * Returns gRPC error 9 (FAILED_PRECONDITION) if order is not PENDING.
 */
message ConfirmOrderRequest {
    string order_id = 1;    // UUID of order to confirm (required)
}

/**
 * Cancel order request.
 * 
 * Transitions order to CANCELLED.
 * Only non-terminal orders can be cancelled.
 * Terminal orders: CANCELLED, FULFILLED
 * 
 * Returns gRPC error 9 (FAILED_PRECONDITION) if order is terminal.
 */
message CancelOrderRequest {
    string order_id = 1;    // UUID of order to cancel (required)
}

/**
 * Fulfill order request.
 * 
 * Transitions order from CONFIRMED → FULFILLED.
 * Only CONFIRMED orders can be fulfilled.
 * 
 * Returns gRPC error 9 (FAILED_PRECONDITION) if order is not CONFIRMED.
 */
message FulfillOrderRequest {
    string order_id = 1;    // UUID of order to fulfill (required)
}

/**
 * List orders by user request.
 * 
 * Retrieves all orders belonging to a specific user.
 * Used by user-service and notification-service.
 */
message ListOrdersRequest {
    string user_id = 1;     // UUID of user whose orders to retrieve (required)
    // Future fields for pagination/filtering:
    // OrderStatus status_filter = 2;
    // int32 limit = 3;
    // string page_token = 4;
}

// ============================================================================
// RESPONSE MESSAGES
// ============================================================================

/**
 * Order response - returned by all order operations.
 * 
 * Contains complete order information including:
 * - Identifiers (id, book_id, user_id)
 * - Order details (quantity, price)
 * - Current state (status)
 * - Timestamps (created_at, updated_at)
 */
message OrderResponse {
    string id = 1;                      // UUID - unique order identifier
    string book_id = 2;                 // UUID - which book was ordered
    string user_id = 3;                 // UUID - who placed the order
    int32 quantity = 4;                 // How many copies
    string price = 5;                   // Unit price at order time (decimal string)
    OrderStatus status = 6;             // Current order state
    string created_at = 7;              // ISO-8601 timestamp when created
    string updated_at = 8;              // ISO-8601 timestamp of last status change
}

/**
 * List of orders - returned by ListOrdersByUser RPC.
 * 
 * Contains paginated results and metadata.
 */
message OrderList {
    repeated OrderResponse orders = 1;  // List of OrderResponse objects
    int32 total_count = 2;              // Total number of orders for user
    // Future fields:
    // string next_page_token = 3;
}

// ============================================================================
// ENUMS
// ============================================================================

/**
 * Order status enumeration.
 * 
 * Represents the lifecycle state of an order.
 * 
 * State transitions:
 * PENDING → CONFIRMED → FULFILLED  (happy path)
 * PENDING → CANCELLED              (user cancels)
 * CONFIRMED → CANCELLED            (allowed)
 * CANCELLED / FULFILLED            (terminal - no further transitions)
 */
enum OrderStatus {
    // Default value (must be first: proto3 requirement)
    PENDING = 0;
    
    // Order confirmed but not yet fulfilled
    CONFIRMED = 1;
    
    // Order cancelled by user or system
    CANCELLED = 2;
    
    // Order completed and fulfilled
    FULFILLED = 3;
}
