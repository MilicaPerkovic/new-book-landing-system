quarkus.application.name=order-service
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${ORDERS_DB_USERNAME:orders_dev}
quarkus.datasource.password=${ORDERS_DB_PASSWORD:orders_dev}
quarkus.datasource.metrics.enabled=true
quarkus.datasource.devservices.enabled=false
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.url=postgresql://${ORDERS_DB_HOST:localhost}:${ORDERS_DB_PORT:5440}/${ORDERS_DB_DATABASE:orders}
quarkus.datasource.jdbc.url=jdbc:postgresql://${ORDERS_DB_HOST:localhost}:${ORDERS_DB_PORT:5440}/${ORDERS_DB_DATABASE:orders}
quarkus.datasource.jdbc.max-size=8

quarkus.hibernate-orm.database.default-schema=orders
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true
quarkus.flyway.schemas=orders
quarkus.flyway.default-schema=orders
quarkus.flyway.table=flyway_history

%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.metrics.enabled=false
%test.quarkus.flyway.migrate-at-start=false

# SmallRye Reactive Messaging Configuration
mp.messaging.outgoing.order-events.type=jms
mp.messaging.outgoing.order-events.destination-type=topic
mp.messaging.outgoing.order-events.destination=order.events
mp.messaging.outgoing.order-events.connection-factory-name=ConnectionFactory

# ActiveMQ Artemis Configuration
quarkus.artemis.url=tcp://localhost:61616
quarkus.artemis.username=artemis
quarkus.artemis.password=artemis
quarkus.artemis.devservices=false
