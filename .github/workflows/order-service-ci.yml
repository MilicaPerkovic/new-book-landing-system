name: Order Service - Unit Tests

on:
  push:
    paths:
      - 'services/order-service/**'
      - '.github/workflows/order-service-ci.yml'

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run order-service unit tests
        run: ./mvnw -B -f services/order-service/pom.xml -Dgroups=unit -DskipITs test
